<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SGE{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <style>
    :root {
      --bg:        #0f1117;
      --bg-2:      #161b27;
      --border:    #2a3147;
      --text:      #e8eaf0;
      --text-2:    #8b92a8;
      --text-3:    #555e7a;
      --accent:    #4f7cff;
      --accent-glow: rgba(79,124,255,.18);
      --red:       #ef4444;
      --red-dim:   #2e0f0f;
      --radius:    10px;
      --radius-sm: 6px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }
    .form-control {
      background: #1e2535;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 13.5px;
      padding: 9px 12px;
      width: 100%;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .form-control::placeholder { color: var(--text-3); }
    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 6px;
    }
    .form-group { margin-bottom: 16px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: all .15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #3d6be8; }
    .alert-danger {
      background: var(--red-dim);
      border: 1px solid var(--red);
      border-radius: var(--radius-sm);
      color: var(--red);
      padding: 12px 16px;
      font-size: 13.5px;
    }
    .login-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
    }
    .login-logo {
      width: 44px; height: 44px;
      background: var(--accent);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px;
      margin: 0 auto 20px;
    }
    .login-title { font-size: 20px; font-weight: 600; text-align: center; margin-bottom: 4px; }
    .login-sub { font-size: 13px; color: var(--text-2); text-align: center; margin-bottom: 28px; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
