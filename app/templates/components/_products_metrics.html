<div class="grid grid-4 mb-6">

  <div class="metric-card blue">
    <div class="metric-icon blue"><i class="bi bi-box-seam"></i></div>
    <div class="metric-label">Quantidade em Estoque</div>
    <div class="metric-value">{{ product_metrics.total_quantity }}</div>
  </div>

  <div class="metric-card red">
    <div class="metric-icon red"><i class="bi bi-currency-dollar"></i></div>
    <div class="metric-label">Custo do Estoque</div>
    <div class="metric-value" style="font-size:20px;">R$ {{ product_metrics.total_cost_price }}</div>
  </div>

  <div class="metric-card green">
    <div class="metric-icon green"><i class="bi bi-graph-up-arrow"></i></div>
    <div class="metric-label">Valor do Estoque</div>
    <div class="metric-value" style="font-size:20px;">R$ {{ product_metrics.total_selling_price }}</div>
  </div>

  <div class="metric-card amber">
    <div class="metric-icon amber"><i class="bi bi-lightning-charge"></i></div>
    <div class="metric-label">Lucro do Estoque</div>
    <div class="metric-value" style="font-size:20px;">R$ {{ product_metrics.total_profit }}</div>
  </div>

</div>
