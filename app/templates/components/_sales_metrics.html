<div class="grid grid-4 mb-6">

  <div class="metric-card blue">
    <div class="metric-icon blue"><i class="bi bi-receipt"></i></div>
    <div class="metric-label">Quantidade de Vendas</div>
    <div class="metric-value">{{ sales_metrics.total_sales }}</div>
  </div>

  <div class="metric-card red">
    <div class="metric-icon red"><i class="bi bi-bag-check"></i></div>
    <div class="metric-label">Produtos Vendidos</div>
    <div class="metric-value">{{ sales_metrics.total_products_sold }}</div>
  </div>

  <div class="metric-card green">
    <div class="metric-icon green"><i class="bi bi-cash-stack"></i></div>
    <div class="metric-label">Valor das Vendas</div>
    <div class="metric-value" style="font-size:20px;">R$ {{ sales_metrics.total_sales_value }}</div>
  </div>

  <div class="metric-card amber">
    <div class="metric-icon amber"><i class="bi bi-bar-chart-line"></i></div>
    <div class="metric-label">Lucro das Vendas</div>
    <div class="metric-value" style="font-size:20px;">R$ {{ sales_metrics.total_sales_profit }}</div>
  </div>

</div>
