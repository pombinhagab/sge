{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">
  <h3 class="display-6">Detalhes do Fornecedor</h3>

  <div class="card">
    <div class="card-body">
      <h3 class="card-title">{{ suppliers.name }}</h3>
      <p clas="cards-text">{{ suppliers.description }}</p>
    </div>
  </div>
  <a href="{% url 'supplier_list' %}" class="btn btn-secondary mt-3">Voltar para a lista de fornecedores</a>
</div>

{% endblock %}
