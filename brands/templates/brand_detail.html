{% extends 'base.html' %}
{% block title %}SGE — Detalhes da Marca{% endblock %}
{% block page_title %}Marcas{% endblock %}

{% block content %}
<div style="max-width:480px;">
  <div class="page-header">
    <div>
      <div class="page-title">{{ item.name }}</div>
      <div class="page-subtitle">Detalhes da Marca</div>
    </div>
    <div class="btn-group">
      {% if perms.brands.change_brand %}
      <a href="{% url 'brand_update' item.id %}" class="btn btn-secondary"><i class="bi bi-pencil"></i> Editar</a>
      {% endif %}
      <a href="{% url 'brand_list' %}" class="btn btn-ghost"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>
  </div>
  <div class="card">
    <div style="padding:16px 20px;">
      <div class="metric-label">Nome</div>
      <div style="color:var(--text);font-weight:500;font-size:16px;">{{ item.name }}</div>
    </div>
  </div>
</div>
{% endblock %}
