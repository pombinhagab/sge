{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">
  <h3 class="display-6">Detalhes da Marca</h3>

  <div class="card">
    <div class="card-body">
      <h3 class="card-title">{{ brands.name }}</h3>
      <p class="cards-text">{{ brands.description }}</p>
    </div>
  </div>
  <a href="{% url 'brand_list' %}" class="btn btn-secondary mt-3">Voltar para a lista de marcas</a>
</div>

{% endblock %}
